# Structure versions the ggml adapter's fused windows were written against.
# The qualification runner turns RED when the live catalog moves past a pin:
# that is the signal to re-audit the corresponding window before adopting
# the new structure version, then update the pin.
binding: jetson_pi_edge_pi05
pins:
  vla_tick_pipeline: 2
  decoder_ffn: 1
  vision_ffn: 2
  qkv_pack: 1
  attention_core: 1
  linear_proj: 1
  norm_fused: 1
  adaln_producer: 1
  modnorm_qkv_chain: 3
  cadence_static: 1
