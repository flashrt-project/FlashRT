binding: pi05
structure: decoder_ffn
dims: {D: 1024, F: 4096, layers: 18}
variant: {activation: gelu, norm_weight_mode: offset, conditioning: ada_ln}
boundary_dtype: bf16

m_profile:
  denoise: {m_class: small, phase: denoise}   # M = host action chunk size

weights_map:
  transformers:
    layout: out_in        # nn.Linear stores [out, in]; slots are [in, out]
    w_gate: "paligemma_with_expert.gemma_expert.model.layers.{i}.mlp.gate_proj.weight"
    w_up: "paligemma_with_expert.gemma_expert.model.layers.{i}.mlp.up_proj.weight"
    w_down: "paligemma_with_expert.gemma_expert.model.layers.{i}.mlp.down_proj.weight"
    w_norm: {const: zeros}   # AdaRMS conditional branch has no learned norm weight

conditioning:
  source: time_embedding
  projection:
    weight: "paligemma_with_expert.gemma_expert.model.layers.{i}.post_attention_layernorm.dense.weight"
    bias: "paligemma_with_expert.gemma_expert.model.layers.{i}.post_attention_layernorm.dense.bias"
    chunk_order: [scale, shift, gate]
  residual_gate: true       # output residual is x + ffn_out * gate

hosts:
  lerobot:
    module_path: "model.paligemma_with_expert.gemma_expert.model.layers.{i}"
    versions: ">=0.5,<0.6"
