binding: qwen3_vl_8b_text
structure: decoder_ffn
dims: {D: 4096, F: 12288, layers: 36}
variant: {activation: silu, norm_weight_mode: direct, conditioning: none}
boundary_dtype: bf16

m_profile:
  prefill: {m_class: medium, phase: prefill}   # M includes vision tokens
  decode: {m_class: micro, phase: decode}

weights_map:
  transformers:
    layout: out_in
    w_gate: "model.language_model.layers.{i}.mlp.gate_proj.weight"
    w_up: "model.language_model.layers.{i}.mlp.up_proj.weight"
    w_down: "model.language_model.layers.{i}.mlp.down_proj.weight"
    w_norm: "model.language_model.layers.{i}.post_attention_layernorm.weight"

hosts:
  transformers:
    module_path: "model.language_model.layers.{i}"
    versions: ">=5.0,<6"
