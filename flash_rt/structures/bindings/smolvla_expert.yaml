binding: smolvla_expert
structure: decoder_ffn
dims: {D: 720, F: 2048, layers: 16}
variant: {activation: silu, norm_weight_mode: direct, conditioning: none}
boundary_dtype: f32

m_profile:
  denoise: {m_class: small, phase: denoise}   # M = action chunk size

weights_map:
  lerobot:
    layout: out_in
    w_gate: "model.vlm_with_expert.lm_expert.layers.{i}.mlp.gate_proj.weight"
    w_up: "model.vlm_with_expert.lm_expert.layers.{i}.mlp.up_proj.weight"
    w_down: "model.vlm_with_expert.lm_expert.layers.{i}.mlp.down_proj.weight"
    w_norm: "model.vlm_with_expert.lm_expert.layers.{i}.post_attention_layernorm.weight"

hosts:
  lerobot:
    module_path: "model.vlm_with_expert.lm_expert.layers.{i}"
    versions: ">=0.5,<0.6"
