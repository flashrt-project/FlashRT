structure: patch_projection
version: 1
description: >
  A vision processor has already materialized one complete spatial or
  spatio-temporal patch per row. The host expresses the following projection
  as a Conv3D whose kernel and stride equal the complete patch, with no
  padding, dilation, overlap, or groups. Under that exact contract the region
  is a flat projection x[M,K] -> y[M,N], not a general convolution.

reference:
  module: patch_projection.reference
  entrypoint: patch_projection_ref

boundary:
  symbolic_dims: [M, K, N]
  inputs:
    - {name: x, dims: [M, K], dtype: "@binding"}
  outputs:
    - {name: y, dims: [M, N], dtype: bf16}

weights:
  - {slot: w, dims: [N, K]}
  - {slot: b, dims: [N], optional: true}

variants:
  layout: [preflattened_full_patch]
  bias: [none, add]

calibration:
  points: [x]

gates:
  parity:
    metrics: [cosine, max_abs, rel_l2]
    data: real_distribution
  latency:
    baselines: [host_conv]
    rule: net_positive_including_boundary
    per_shape: true
  qualification:
    input_last_dim: K
    conv_rank: 3
    kernel_equals_stride: true
    padding: [0, 0, 0]
    dilation: [1, 1, 1]
    groups: 1

evidence:
  - "Qwen3-VL real 6256x1536 patches on RTX 5090: official Conv3D 1.294 ms,
     Hub BF16 projection 0.127 ms (10.20x), cosine 0.999998."
  - "LingBot-VLA three-view real processor boundary 768x1176 on RTX 5090:
     official Qwen2.5-VL Conv3D 0.336 ms, Hub BF16 projection 0.0327 ms
     (10.27x), cosine 0.999996."
