binding: groot_n16_dit
structure: vision_ffn
dims: {D: 1536, F: 6144, layers: 32}
variant: {activation: gelu}
boundary_dtype: bf16

m_profile:
  denoise: {m_class: small, phase: denoise}   # M = action tokens per step

weights_map:
  isaac_gr00t:
    layout: out_in
    w_fc1: "action_head.model.transformer_blocks.{i}.ff.net.0.proj.weight"
    b_fc1: "action_head.model.transformer_blocks.{i}.ff.net.0.proj.bias"
    w_fc2: "action_head.model.transformer_blocks.{i}.ff.net.2.weight"
    b_fc2: "action_head.model.transformer_blocks.{i}.ff.net.2.bias"
    w_norm: {const: ones}    # DiT norm3 seam; affine may be absent
    b_norm: {const: zeros}

hosts:
  isaac_gr00t:
    module_path: "action_head.model.transformer_blocks.{i}"
    versions: "n1.6"
