structure: qkv_pack
version: 1
description: >
  Pack sibling linears that share one input and a fixed consumption
  order (attention q/k/v, gated-MLP gate/up) into a single GEMM.
  Small-M sibling GEMMs sit on the launch/latency floor, so the win is
  structural (three launches become one), not per-kernel. Two bind
  forms: "leaf" replaces the first sibling slot with the packed GEMM
  (later slots read preallocated stash buffers; the host's own call
  order is the in-graph data dependency) and "module" replaces a whole
  q/k/v/out attention block with packed GEMM + SDPA at a declared
  compute dtype + the original out projection.

reference:
  module: qkv_pack.reference
  entrypoint: qkv_pack_ref

boundary:
  symbolic_dims: [M, K, N_i]
  inputs:
    - {name: x, dims: [M, K], dtype: "@binding"}
  outputs:
    - {name: y_i, dims: [M, N_i], dtype: "@binding", repeated: true}

weights:
  - {slot: w_i, dims: [K, N_i], repeated: true}
  - {slot: b_i, dims: [N_i], optional: true, repeated: true}

variants:
  bind: [leaf, module]
  in_dtype: [bf16_fused_quant, fp8_static]
  sdpa_dtype: [none, bf16]        # module form only

qualification:
  - "siblings share the input tensor and K dim; call order is fixed and
     observable (the leaf form relies on it for stash ordering)"
  - "joint per-tensor weight scale — the rounding difference against
     per-sibling scales is adjudicated by the layer parity gate"
  - "module form requires q_proj/k_proj/v_proj/out_proj plus head_dim
     and scale attributes, with the standard block dataflow"

calibration:
  points: [x]

gates:
  parity:
    metrics: [cosine, max_abs, p99_abs]
    data: real_distribution
  latency:
    baselines: [torch_compile, vendor]
    rule: net_positive_including_boundary
    per_shape: true
  qualification:
    siblings_min: 2
    weight_elements_min: 1048576

discovery:
  families: >
    attention sibling groups already produced by the linear_proj
    discovery patterns (q/k/v[/out] under one parent)

evidence:
  - "pi05 expert leaf form — r8, +0.087 ratio (launch 3->1, M=50)"
  - "pi05 vision module form — r9, +0.060 ratio (SigLIP, 27 blocks)"
  - "pi05 trunk leaf bf16 entry — r12 (M=712 prefill)"
