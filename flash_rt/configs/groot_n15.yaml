# FlashRT — GR00T N1.5 model configuration (metadata only; runtime dimensions
# come from the checkpoint and the Isaac-GR00T data config).
name: groot_n15
display_name: "NVIDIA GR00T-N1.5-3B"

backbone:
  family: eagle2_5          # SigLIP2 vision tower + Qwen3 LLM
  llm_layers: 12            # truncated; persisted in the checkpoint
  image_size: 224
  tokens_per_image: 256

action_head:
  type: flow_matching_dit
  num_inference_timesteps: 4
  action_horizon: 16

runtime:
  framework: torch
  hardware: rtx_sm89        # RTX 4090
  precision: bf16           # CUDA Graph; no FP8 calibration
  attention: sdpa
