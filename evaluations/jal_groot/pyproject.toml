[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groot-flashrt-jal-comparison"
version = "0.1.0"
description = "Matched GR00T evaluation against the Jetson AI Lab TensorRT baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["groot_compare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
